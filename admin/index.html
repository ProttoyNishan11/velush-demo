<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — VELUSH</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="admin.css"></head><body class="admin-login"><main class="auth-card"><img src="../assets/logo.jpeg" alt="VELUSH" class="admin-logo"><div class="eyebrow">ADMIN</div><h1>Sign in.</h1><form id="loginForm"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="btn btn-dark btn-wide" type="submit">Sign in</button></form><div id="loginMsg" class="notice" hidden></div><a href="../index.html" class="muted back-link">← Back to store</a></main><script src="../js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient(VELUSH_CONFIG.supabaseUrl,VELUSH_CONFIG.supabaseAnonKey);document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const m=document.getElementById('loginMsg');const {error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){m.hidden=false;m.className='notice error';m.textContent='Unable to sign in. Check credentials.';return}location.href='dashboard.html'}</script></body></html>
